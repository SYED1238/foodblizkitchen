<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1C1410">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FoodBliz Kitchen — Partner Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="screen-canvas">
    <!-- Top Branded Hero -->
    <header class="hero-section">
      <!-- Culinary Tech & Kitchen Order Flow SVG Pattern -->
      <svg class="hero-kitchen-bg" viewBox="0 0 460 320" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Soft warm ambient kitchen heat glow centered behind emblem -->
          <radialGradient id="kitchenHeatGlow" cx="50%" cy="37%" r="55%">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
            <stop offset="50%" stop-color="#D97706" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#1C1410" stop-opacity="0" />
          </radialGradient>

          <!-- Refined modern kitchen dot matrix (replaces harsh road lines) -->
          <pattern id="kitchenDotMatrix" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.1" fill="#F59E0B" fill-opacity="0.09" />
          </pattern>
        </defs>

        <!-- Ambient Heat Glow -->
        <rect width="100%" height="100%" fill="url(#kitchenHeatGlow)" />

        <!-- Dot Matrix -->
        <rect width="100%" height="100%" fill="url(#kitchenDotMatrix)" />

        <!-- Order Flow Concentric Pulse Rings radiating from Kitchen Emblem -->
        <circle cx="230" cy="118" r="54" stroke="#F59E0B" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="3 4" />
        <circle cx="230" cy="118" r="92" stroke="#F59E0B" stroke-opacity="0.11" stroke-width="1" stroke-dasharray="5 6" />
        <circle cx="230" cy="118" r="140" stroke="#F59E0B" stroke-opacity="0.06" stroke-width="0.8" />

        <!-- Kitchen Station Pulse Nodes on the rings -->
        <circle cx="282" cy="85" r="3" fill="#F59E0B" fill-opacity="0.38" />
        <circle cx="282" cy="85" r="6" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="1" />
        <circle cx="165" cy="135" r="2.5" fill="#F59E0B" fill-opacity="0.32" />
        <circle cx="320" cy="155" r="3.2" fill="#F59E0B" fill-opacity="0.38" />
        <circle cx="320" cy="155" r="7.5" stroke="#F59E0B" stroke-opacity="0.18" stroke-width="1" />

        <!-- Culinary Motifs (Watermarks) -->
        <!-- Top-Left: Cloche / Serving Dome with Steam -->
        <g transform="translate(32, 44)" stroke="#F59E0B" stroke-opacity="0.22" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 6 C12 2, 16 -2, 14 -5 M22 6 C20 2, 24 -2, 22 -5" stroke-opacity="0.18" />
          <circle cx="18" cy="10" r="2.5" fill="#F59E0B" fill-opacity="0.15" />
          <path d="M3 24 C3 13, 33 13, 33 24 Z" />
          <path d="M0 24 H36" stroke-width="1.6" />
        </g>

        <!-- Top-Right: Dynamic Chef Flame / Burner Heat -->
        <g transform="translate(390, 42)" stroke="#F59E0B" stroke-opacity="0.22" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 2 C22 10, 26 14, 25 20 C24 26, 18 30, 12 30 C5 30, 0 25, 0 18 C0 10, 8 8, 12 2 C13 7, 15 10, 18 2 Z" />
          <path d="M11 16 C14 20, 15 22, 13 25 C11 27, 8 27, 6 25 C4 23, 5 19, 7 17 C9 15, 10 14, 11 16 Z" fill="#F59E0B" fill-opacity="0.15" />
        </g>

        <!-- Bottom-Left: Kitchen KOT Order Slip with Live Checkmark -->
        <g transform="translate(30, 226)" stroke="#F59E0B" stroke-opacity="0.20" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 0 H34 V34 L31 31 L28 34 L25 31 L22 34 L19 31 L16 34 L13 31 L10 34 L7 31 L4 34 L2 32 Z" />
          <path d="M8 8 H28 M8 14 H22 M8 20 H25" stroke-opacity="0.28" />
          <path d="M20 22 L23 25 L28 19" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="1.5" />
        </g>

        <!-- Bottom-Right: Skillet / Sauté Pan with Steam Arcs -->
        <g transform="translate(386, 226)" stroke="#F59E0B" stroke-opacity="0.20" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 -4 Q8 -10 12 -14 M18 -2 Q16 -8 20 -12" stroke-opacity="0.18" />
          <ellipse cx="14" cy="12" rx="14" ry="7" />
          <line x1="26" y1="10" x2="42" y2="2" stroke-width="2" />
        </g>
      </svg>

      <!-- Top Row: Brand Label + Live Status Pill -->
      <div class="hero-top-bar">
        <span class="hero-brand-name">FoodBliz</span>
        <div class="live-dispatch-badge">
          <span class="live-dot" aria-hidden="true"></span>
          <span>● LIVE KITCHEN</span>
        </div>
      </div>

      <!-- Center Hero Focal Point -->
      <div class="hero-center-content">
        <div class="emblem-wrap">
          <img src="/icon-192.png?v=2" alt="FoodBliz Kitchen" class="emblem-img" width="76" height="76">
        </div>
        <h1 class="hero-headline">Cook fast.<br>Zero missed orders.</h1>
        <div class="feature-chips-row">
          <span class="feature-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9 9 0 0 0-9 9c0 3.8 2.3 7 5.7 8.3L8 22h8l-.7-2.7C18.7 18 21 14.8 21 11a9 9 0 0 0-9-9zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-4 7h8v2H8v-2z"/></svg>
            Instant KOT Alerts
          </span>
          <span class="feature-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
            Live Order Queue
          </span>
        </div>
      </div>
    </header>

    <!-- Curved White Bottom Sheet -->
    <main class="bottom-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div id="saved-banner" class="saved-banner" hidden>
        <div class="saved-details">
          <span class="saved-tag">Connected Kitchen</span>
          <strong id="saved-restaurant-name"></strong>
        </div>
        <button type="button" id="btn-continue-saved" class="btn-secondary">Open</button>
      </div>

      <div class="sheet-intro">
        <h2 class="sheet-title">Connect your kitchen</h2>
        <p class="sheet-subtitle">Enter your kitchen partner code once to start receiving live orders.</p>
      </div>

      <form id="restaurant-code-form" class="sheet-form" novalidate>
        <div class="field-container">
          <label for="restaurant-code-input" class="input-label">Kitchen Partner Code</label>
          <div class="input-prefix-wrapper">
            <svg class="input-leading-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <input
              id="restaurant-code-input"
              name="code"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="24"
              placeholder="ENTER CODE"
              required
            >
          </div>
          <p id="form-error" class="form-error" role="alert" hidden></p>
        </div>

        <div class="sheet-actions">
          <button type="submit" id="btn-connect" class="btn-primary">
            <span id="btn-connect-text">Continue to Kitchen →</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <button type="button" id="btn-reset-saved" class="btn-link" hidden>Clear saved kitchen</button>
          <footer class="sheet-footer-note">One-time setup • Stays connected automatically</footer>
        </div>
      </form>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
